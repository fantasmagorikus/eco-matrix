name: ci / gates

on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: security/audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Ensure pnpm present (npm -g fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@9.15.9
          fi
      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - run: pnpm install
      - name: pnpm audit (report only)
        run: pnpm audit --audit-level=high || true

  lint-all:
    name: lint/all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Ensure pnpm present (npm -g fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@9.15.9
          fi
      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install deps
        run: pnpm install
      - name: Lint
        run: pnpm lint

  typecheck-all:
    name: typecheck/all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Ensure pnpm present (npm -g fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@9.15.9
          fi
      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install deps
        run: pnpm install
      - name: Type check
        run: pnpm typecheck

  test-all:
    name: test/all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Ensure pnpm present (npm -g fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@9.15.9
          fi
      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install deps
        run: pnpm install
      - name: Test
        run: pnpm test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage

      - name: Coverage summary (job summary)
        run: |
          node -e "const fs=require('fs');const p='apps/web/coverage/coverage-summary.json';if(!fs.existsSync(p)){process.exit(0)};const j=JSON.parse(fs.readFileSync(p,'utf8'));const g=j.total;const md=['## Coverage','', '| Metric | % |','|---|---|',`| Lines | ${g.lines.pct} |`,`| Branches | ${g.branches.pct} |`,`| Functions | ${g.functions.pct} |`,`| Statements | ${g.statements.pct} |`,''].join('\n');fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,md);"

      - name: Upload to Coveralls (public repos)
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: apps/web/coverage/lcov.info
          flag-name: web
          parallel: false

  web-build:
    name: web/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Ensure pnpm present (npm -g fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm i -g pnpm@9.15.9
          fi
      - name: Enable corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Install deps
        run: pnpm install
      - name: Build web app
        run: pnpm -C apps/web build
